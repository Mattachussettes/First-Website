  <script>
    function myFunction() {
      var input = prompt(
        "When do you... I don't remember the answer",
        "MMM DD, YYYY HH:MM:SS"
      );

      // date we're counting down to
      var countDownDate = new Date(input).getTime();

      // Update every 1 second
      var x = setInterval(function () {
        // today's date and time
        var now = new Date().getTime();

        //distance between now and the count down date
        var distance = countDownDate - now;

        // Time calculations for days, hours, minutes and seconds
        var days = Math.floor(distance / (1000 * 60 * 60 * 24));
        var hours = Math.floor(
          (distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)
        );
        var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        var seconds = Math.floor((distance % (1000 * 60)) / 1000);

        // Display the result
        document.getElementById("demo").innerHTML =
          days + "d " + hours + "h " + minutes + "m " + seconds + "s ";

        // count down is finished, write
        if (distance < 0) {
          clearInterval(x);
          document.getElementById("demo").innerHTML = "Happy Birthday!!!";
        }
      }, 1000);

      document.getElementById("demo").addEventListener("click", (event) => {
        clearInterval(x);
      });
    }
  </script>
